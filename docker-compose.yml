# ============================================================================
# HOS-BACKOFFICE — Production infrastructure (Phase 2, MASTER_DIRECTIVE §4)
#   postgres:15-alpine  ·  redis:7-alpine (AOF)  ·  minio/minio (WORM)
#   app = Next.js 15 (multi-stage Dockerfile)
# Migrations db/migrations/*.sql are applied automatically on FIRST boot via
# /docker-entrypoint-initdb.d (alphabetical order: 001 schema → 002 seed).
# ============================================================================
name: hos-backoffice

services:
  postgres:
    image: postgres:15-alpine
    container_name: hos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hos_backoffice
      POSTGRES_USER: hos_admin
      POSTGRES_PASSWORD: ${PG_PASSWORD:-hos_secret_2560}
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Auto-migrate on first initialisation only (initdb directory is empty)
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hos_admin -d hos_backoffice"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hosnet]

  redis:
    image: redis:7-alpine
    container_name: hos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hosnet]

  minio:
    image: minio/minio:latest
    container_name: hos-minio
    restart: unless-stopped
    # WORM / Object Lock mode — required for COA, cold-chain logs, PAdES-LTV PDFs
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-hos_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-hos_minio_secret_2560}
      MINIO_WORM: "on"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [hosnet]

  # Create the WORM audit bucket once minio is ready (Object Lock must be
  # enabled on the bucket at creation time).
  minio-init:
    image: minio/mc:latest
    container_name: hos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
        $${MINIO_ACCESS_KEY:-hos_admin} $${MINIO_SECRET_KEY:-hos_minio_secret_2560} &&
      mc mb --ignore-existing local/hos-audit-worm || true &&
      mc ilm rule enable local/hos-audit-worm --immutable 2>/dev/null ||
      mc ilm rule add local/hos-audit-worm --apply --prefix '' --immutable || true
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-hos_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-hos_minio_secret_2560}
    restart: "no"
    networks: [hosnet]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hos-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: hos_backoffice
      PG_USER: hos_admin
      PG_PASSWORD: ${PG_PASSWORD:-hos_secret_2560}
      DATABASE_URL: postgres://hos_admin:${PG_PASSWORD:-hos_secret_2560}@postgres:5432/hos_backoffice
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-hos_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-hos_minio_secret_2560}
      MOPH_ISSUER: ${MOPH_ISSUER:-https://id.moph.go.th}
      MOPH_CLIENT_ID: ${MOPH_CLIENT_ID:-hos-backoffice}
      MOPH_REDIRECT_URI: ${MOPH_REDIRECT_URI:-http://localhost:3000/api/auth/moph-provider-callback}
      HOSPITAL_HCODE: "10670"
      STORE_FILE: .data/live-store.json
      PENALTY_DAILY_RATE: "0.005"
      PENALTY_CAP: "0.10"
      STANDSTILL_WORKING_DAYS: "7"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - app_data:.data
    networks: [hosnet]

volumes:
  pg_data:
  redis_data:
  minio_data:
  app_data:

networks:
  hosnet:
    driver: bridge
